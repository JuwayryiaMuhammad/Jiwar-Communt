# Continuous deployment to the staging server (deploy/README.md). Runs after
# CI passes on a push to main, or by hand on main. The images are built here,
# never on the server, and pushed to GHCR under the commit SHA: the API as
# `<sha>`, the dashboards as `<sha>-admin` and `<sha>-manager` and the public
# web pages as `<sha>-public` in the same package, so one release is one SHA. The server's key can run the deploy
# script and nothing else.
#
# Repository settings: secret DEPLOY_SSH_KEY (private key of jiwar-deploy),
# secret DEPLOY_KNOWN_HOSTS (ssh-keyscan of the server), variable DEPLOY_HOST.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and a newer one waits instead of cancelling a
# deploy halfway through its migrations.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: http://${{ vars.DEPLOY_HOST }}/api/v1/health
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      # Image names must be lowercase; the repository name is not.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          # Links the package to this repository, so this job's token can pull it.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The dashboards (apps/Dockerfile): one image each, same SHA.
      - name: Admin dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/Dockerfile
          build-args: APP=admin
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}-admin
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Manager dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/Dockerfile
          build-args: APP=manager
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}-manager
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager

      - name: Public web pages image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/Dockerfile
          build-args: APP=public
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}-public
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=public
          cache-to: type=gha,mode=max,scope=public

      # The job token goes to the server on stdin and expires with this job.
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "jiwar-deploy@$HOST" "deploy $SHA"

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 3 "http://${{ vars.DEPLOY_HOST }}/api/v1/health"
