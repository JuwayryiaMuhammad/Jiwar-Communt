# /etc/nginx/sites-available/jiwar-community, linked in sites-enabled.
# Staging on the bare IP: no domain, so plain HTTP and the default server on
# port 80. The other sites on this host match by server_name and are unaffected.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended: the app trusts exactly one hop
        # (TRUST_PROXY=1), so a client cannot slip in its own address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The private bucket on MinIO, for presigned URLs. Host is kept as is:
    # it is part of the signature (S3_ENDPOINT is this server's address).
    location /jiwar/ {
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
